name: Coding Standards Check

# Enforces AINative coding standards on PRs:
#   - No AI attribution in commits/PR description
#   - Test coverage >=80% for changed files
#   - TDD compliance: changed source files have tests
#
# This is a REQUIRED status check — PRs cannot merge without passing.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  standards-check:
    name: Coding Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for commit checks

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check commit messages for AI attribution
        if: github.event_name == 'pull_request'
        run: |
          echo "Checking commits for AI attribution..."
          # Get commits in this PR
          git log --format="%B" origin/${{ github.base_ref }}..HEAD > /tmp/commits.txt

          # Check for AI attribution patterns
          if grep -iE "(co-authored-by:.*(claude|anthropic|chatgpt|openai|copilot)|generated by (claude|chatgpt|ai|gpt)|written by (claude|ai|gpt)|\[claude\]|\[chatgpt\])" /tmp/commits.txt; then
            echo "::error::Commit messages contain AI attribution. Remove before merging."
            exit 1
          fi
          echo "✅ No AI attribution found in commits"

      - name: Check PR description for AI attribution
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "Checking PR description..."
          echo "$PR_TITLE" > /tmp/pr.txt
          echo "$PR_BODY" >> /tmp/pr.txt

          if grep -iE "(co-authored-by:.*(claude|anthropic|chatgpt|openai|copilot)|generated by (claude|chatgpt|ai|gpt)|written by (claude|ai|gpt)|\[claude\]|\[chatgpt\])" /tmp/pr.txt; then
            echo "::error::PR description contains AI attribution. Remove before merging."
            exit 1
          fi
          echo "✅ No AI attribution found in PR description"

      # Squash-merge synthesizes a brand-new commit message (title + body,
      # often with GitHub's own auto-added Co-authored-by trailer from its
      # co-author detection) that never existed in any of the PR branch's
      # raw commits checked above -- so it was slipping onto main unchecked
      # (see #1595/#1597/#1600, which all triggered this gap). Runs on the
      # push-to-main event, after the merge commit already exists, so a hit
      # here can't block the merge -- it only surfaces the problem fast so
      # it can be fixed forward (edit the merge commit message / amend).
      - name: Check merge commit message for AI attribution
        if: github.event_name == 'push'
        run: |
          echo "Checking merge commit message for AI attribution..."
          git log -1 --format="%B" HEAD > /tmp/merge-commit.txt

          if grep -iE "(co-authored-by:.*(claude|anthropic|chatgpt|openai|copilot)|generated by (claude|chatgpt|ai|gpt)|written by (claude|ai|gpt)|\[claude\]|\[chatgpt\])" /tmp/merge-commit.txt; then
            echo "::error::Merge commit message on main contains AI attribution ($(git rev-parse HEAD)). This slipped past the PR-branch check via GitHub's squash-merge message synthesis -- fix forward with 'git commit --amend' + force-push, or an equivalent history rewrite."
            exit 1
          fi
          echo "✅ No AI attribution found in merge commit message"

      - name: Run tests with coverage
        run: |
          echo "Running tests with coverage..."
          pnpm test:coverage 2>&1 | tee /tmp/coverage.txt || true

      - name: Check coverage threshold
        run: |
          echo "Checking coverage threshold (>=80%)..."
          # Extract coverage percentage from vitest output
          coverage=$(grep -oP "All files.*?\|\s*\K[\d.]+(?=%)" /tmp/coverage.txt | head -1 || echo "0")
          echo "Coverage: ${coverage}%"

          if [ -z "$coverage" ]; then
            echo "::warning::Could not determine coverage percentage"
            exit 0
          fi

          # Compare with threshold (80)
          if (( $(echo "$coverage < 80" | bc -l) )); then
            echo "::error::Coverage ${coverage}% is below 80% threshold"
            exit 1
          fi
          echo "✅ Coverage ${coverage}% meets threshold"

      - name: TypeScript check
        run: |
          echo "Running TypeScript check..."
          pnpm tsc --noEmit 2>&1 | tee /tmp/tsc.txt
          # Allow up to 28 pre-existing errors (baseline)
          errors=$(grep -c "error TS" /tmp/tsc.txt || echo "0")
          if [ "$errors" -gt 28 ]; then
            echo "::error::TypeScript errors ($errors) exceed baseline (28)"
            exit 1
          fi
          echo "✅ TypeScript check passed (${errors} pre-existing errors)"

      - name: Build check
        env:
          # The app hard-fails its production build with no AUTH_SECRET set
          # (see app/(auth)/auth.ts) -- this job never set one, so every real
          # build attempt failed here regardless of the PR's own changes.
          # Falls back to an ephemeral per-run secret (ref #1153) when the
          # repo secret isn't configured: `next build` only needs some
          # value present to pass its startup guard, never signs or
          # verifies a real session here, so a throwaway value is safe.
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          echo "Running build..."
          export AUTH_SECRET="${AUTH_SECRET:-$(openssl rand -base64 32)}"
          pnpm build
          echo "✅ Build successful"
